<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tiro Maestro - Entrenador de Billar</title>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    
    <!-- Babel -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: { felt: '#15803d', feltDark: '#14532d', wood: '#3f2e18', woodLight: '#5c4028' },
                    animation: { 'fade-in': 'fadeIn 0.5s ease-out', 'pop-up': 'popUp 2s ease-out forwards', 'roll-in': 'rollIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275)' },
                    keyframes: {
                        fadeIn: { '0%': { opacity: '0', transform: 'translateY(10px)' }, '100%': { opacity: '1', transform: 'translateY(0)' } },
                        popUp: { '0%': { opacity: '0', transform: 'translate(-50%, 20px) scale(0.9)' }, '10%': { opacity: '1', transform: 'translate(-50%, 0) scale(1)' }, '80%': { opacity: '1', transform: 'translate(-50%, 0) scale(1)' }, '100%': { opacity: '0', transform: 'translate(-50%, -20px) scale(0.9)' } },
                        rollIn: { '0%': { opacity: '0', transform: 'scale(0.5) rotate(-180deg)' }, '100%': { opacity: '1', transform: 'scale(1) rotate(0deg)' } }
                    }
                }
            }
        }
    </script>

    <style>
        body { touch-action: manipulation; }
        .wood-texture { background-color: #3f2e18; background-image: repeating-linear-gradient(45deg, rgba(0,0,0,0.05) 0px, rgba(0,0,0,0.05) 2px, transparent 2px, transparent 4px); }
        .felt-bg { background-image: radial-gradient(circle at center, rgba(255,255,255,0.1) 0%, rgba(0,0,0,0.4) 100%); transition: background-color 2s ease; }
        .pool-ball { border-radius: 50%; display: flex; align-items: center; justify-content: center; position: relative; cursor: pointer; transition: transform 0.2s, box-shadow 0.2s; }
        .pool-ball:hover { transform: scale(1.05); z-index: 10; }
        .pool-ball:active { transform: scale(0.95); }
        .pool-ball::after { content: ''; position: absolute; top: 15%; left: 15%; width: 30%; height: 20%; border-radius: 50%; background: radial-gradient(circle, rgba(255,255,255,0.8) 0%, rgba(255,255,255,0) 70%); filter: blur(2px); }
        .ball-number { background: white; border-radius: 50%; width: 50%; height: 50%; display: flex; align-items: center; justify-content: center; font-weight: 800; color: black; font-family: monospace; box-shadow: inset 0 0 5px rgba(0,0,0,0.2); }
        /* V7 Trainer */
        .v7-pool-border { background: linear-gradient(45deg, #3e2723, #5d4037); padding: 20px; border-radius: 15px; box-shadow: 0 15px 40px rgba(0,0,0,0.8); position: relative; width: 700px; }
        .v7-felt { width: 100%; height: 280px; background-color: #0a5c0a; box-shadow: inset 0 0 50px rgba(0,0,0,0.7); position: relative; overflow: hidden; border: 2px solid #074007; }
        .v7-diamond { width: 8px; height: 8px; background: #ddd; transform: rotate(45deg); position: absolute; top: -10px; }
        .v7-ball { width: 36px; height: 36px; background: radial-gradient(circle at 30% 30%, #fff, #bbb 40%, #444 100%); border-radius: 50%; position: absolute; bottom: 100px; left: 500px; z-index: 5; box-shadow: 2px 4px 8px rgba(0,0,0,0.4); }
        .v7-cue { width: 550px; height: 12px; background: linear-gradient(90deg, #2d1b15 0%, #5d4037 40%, #d7ccc8 96%, #29b6f6 98%, #fff 100%); position: absolute; bottom: 112px; left: -58px; border-radius: 6px; z-index: 10; transform-origin: center right; box-shadow: 4px 8px 15px rgba(0,0,0,0.5); will-change: transform; }
        .v7-measure-box { flex: 1; background: #2a2a2a; border: 1px solid #444; border-radius: 4px; padding: 4px; display: flex; flex-direction: column; align-items: center; opacity: 0.5; transition: all 0.2s; position: relative; cursor: pointer; }
        .v7-measure-box:hover { background: #333; }
        .v7-measure-box.active { opacity: 1; border-color: #007bff; background: #203040; box-shadow: 0 0 10px rgba(0, 123, 255, 0.2); }
        .v7-beat-dot { width: 6px; height: 6px; background: #555; border-radius: 50%; margin: 2px; }
        .v7-beat-dot.active { background: #00ff88; box-shadow: 0 0 4px #00ff88; transform: scale(1.2); }
        .v7-beat-dot.hit { background: #ff0055; box-shadow: 0 0 6px #ff0055; transform: scale(1.4); }
        .scroller::-webkit-scrollbar { height: 2px; }
        .scroller::-webkit-scrollbar-track { background: transparent; }
        .scroller::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .dark .scroller::-webkit-scrollbar-thumb { background: #334155; }
        .cursor-move { cursor: move; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen overflow-y-auto">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo, useCallback } = React;

        // --- ICONOS ---
        const Icons = {
            List: () => <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M8 6h13"/><path d="M8 12h13"/><path d="M8 18h13"/><path d="M3 6h.01"/><path d="M3 12h.01"/><path d="M3 18h.01"/></svg>,
            Table: () => <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><rect width="18" height="12" x="3" y="10" rx="2"/><circle cx="12" cy="16" r="2"/></svg>,
            Stance: () => <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>,
            Grip: () => <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M18 11V6a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v0"/><path d="M14 10V4a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v2"/><path d="M10 10.5V6a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v8"/><path d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-5.99-2.34l-3.6-3.6a2 2 0 0 1 2.83-2.82L7 15"/></svg>,
            Eye: () => <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>,
            Stroke: () => <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>,
            Physics: () => <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="3"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>,
            Sun: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>,
            Moon: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>,
            Unlock: () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 9.9-1"/></svg>,
            Move: () => <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polyline points="5 9 2 12 5 15"/><polyline points="9 5 12 2 15 5"/><polyline points="19 9 22 12 19 15"/><polyline points="9 19 12 22 15 19"/><line x1="2" x2="22" y1="12" y2="12"/><line x1="12" x2="12" y1="2" y2="22"/></svg>,
            Play: () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polygon points="5 3 19 12 5 21 5 3" /></svg>,
            Flip: () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/><path d="M16 16h5v5"/></svg>,
            Folder: () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/></svg>,
            LogOut: () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" x2="9" y1="12" y2="12"/></svg>,
            Upload: () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" x2="12" y1="3" y2="15"/></svg>,
            Download: () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>,
            Check: () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3"><path d="M20 6 9 17l-5-5"/></svg>,
            X: () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>,
            Trash: () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>,
            Plus: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>,
            Home: () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>,
            Quiz: () => <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/><path d="m9 15 2 2 4-4"/></svg>,
            ArrowRight: () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>,
            Expand: () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M15 3h6v6"/><path d="M9 21H3v-6"/><path d="M21 3l-7 7"/><path d="M3 21l7-7"/></svg>,
            Timer: () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>,
            Activity: () => <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>,
            Settings: () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.1a2 2 0 0 1-1-1.74v-.47a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>,
            Layers: () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></svg>,
            Refresh: () => <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
        };

        // --- UTILS ---
        const playSound = (type) => {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            if (!AudioContext) return;
            try {
                const ctx = new AudioContext();
                if (ctx.state === 'suspended') ctx.resume();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);
                const now = ctx.currentTime;
                if (type === 'tick') {
                    osc.frequency.setValueAtTime(800, now); osc.type = 'square';
                    gain.gain.setValueAtTime(0.05, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
                    osc.start(now); osc.stop(now + 0.1);
                } else if (type === 'hit') {
                    osc.frequency.setValueAtTime(150, now); osc.frequency.exponentialRampToValueAtTime(40, now + 0.1);
                    osc.type = 'triangle'; gain.gain.setValueAtTime(0.3, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
                    osc.start(now); osc.stop(now + 0.2);
                } else if (type === 'chalk') {
                    const bufferSize = ctx.sampleRate * 0.1; const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
                    const data = buffer.getChannelData(0); for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
                    const noise = ctx.createBufferSource(); noise.buffer = buffer;
                    const noiseGain = ctx.createGain(); noiseGain.gain.value = 0.1;
                    noise.connect(noiseGain); noiseGain.connect(ctx.destination); noise.start();
                } else if (type === 'success') {
                    osc.frequency.setValueAtTime(440, now); osc.frequency.setValueAtTime(554, now + 0.1);
                    osc.type = 'sine'; gain.gain.setValueAtTime(0.1, now); gain.gain.linearRampToValueAtTime(0, now + 0.3);
                    osc.start(now); osc.stop(now + 0.3);
                }
            } catch (e) { console.error(e); }
        };

        const saveToLocal = (key, data) => { try { localStorage.setItem(key, JSON.stringify(data)); } catch(e) {} };
        const getFromLocal = (key) => { try { const data = localStorage.getItem(key); return data ? JSON.parse(data) : null; } catch(e) { return null; } };

        // --- COMPONENTS (DEFINED IN ORDER) ---

        const StopwatchTool = ({ onComplete }) => {
            const [time, setTime] = useState(5);
            const [active, setActive] = useState(false);
            useEffect(() => {
                let interval = null;
                if (active && time > 0) interval = setInterval(() => setTime(t => t - 1), 1000);
                else if (time === 0) {
                    setActive(false); playSound('success'); if (onComplete) onComplete();
                }
                return () => clearInterval(interval);
            }, [active, time]);
            const start = () => { setTime(5); setActive(true); playSound('tick'); };
            return (
                <div className="flex items-center gap-2 mt-2">
                    <button onClick={start} disabled={active} className={`text-xs px-3 py-1 rounded-full font-bold flex items-center gap-1 transition ${active ? 'bg-red-100 text-red-600' : 'bg-indigo-100 text-indigo-600 hover:bg-indigo-200'}`}>
                        <Icons.Timer /> {active ? `Congelado: ${time}s` : 'Iniciar Cronómetro (5s)'}
                    </button>
                </div>
            );
        };

        const BilliardBallBtn = ({ color, number, label, onClick, subIcon, size = 'large' }) => {
            const sizeClass = size === 'large' ? 'w-24 h-24' : 'w-16 h-16';
            const numSize = size === 'large' ? 'text-2xl' : 'text-lg';
            return (
                <div className="flex flex-col items-center gap-2 group cursor-pointer" onClick={onClick}>
                    <div className={`pool-ball ${sizeClass} shadow-ball animate-roll-in`} style={{backgroundColor: color}}>
                        <div className="ball-number">{subIcon ? subIcon : <span className={numSize}>{number}</span>}</div>
                    </div>
                    <span className="text-[10px] font-bold text-white uppercase tracking-wider bg-black/40 px-2 py-0.5 rounded-full backdrop-blur-sm group-hover:bg-emerald-600 transition">{label}</span>
                </div>
            );
        };

        const RoutineChecklist = ({ data, onComplete }) => {
            const [checkedItems, setCheckedItems] = useState({});
            const toggleItem = (stepIdx) => { 
                setCheckedItems(prev => ({...prev, [stepIdx]: !prev[stepIdx]})); playSound('chalk');
            };
            return (
                <div className="space-y-4">
                    {data.checklist.map((phase, pIdx) => (
                        <div key={pIdx} className="bg-slate-50 dark:bg-slate-800/50 p-3 rounded-xl border border-slate-200 dark:border-slate-700">
                            <h4 className="text-xs font-bold text-indigo-500 uppercase mb-2 border-b border-slate-200 dark:border-slate-700 pb-1">{phase.stage}</h4>
                            <div className="space-y-2">
                                {phase.steps.map((step, sIdx) => {
                                    const key = `${pIdx}-${sIdx}`; const isChecked = checkedItems[key];
                                    return (
                                        <div key={sIdx} onClick={() => toggleItem(key)} className={`flex items-center gap-3 p-2 rounded-lg cursor-pointer transition ${isChecked ? 'bg-emerald-100 dark:bg-emerald-900/30' : 'hover:bg-white dark:hover:bg-slate-700'}`}>
                                            <div className={`w-5 h-5 rounded-full flex items-center justify-center border transition ${isChecked ? 'bg-emerald-500 border-emerald-500 text-white' : 'border-slate-400 text-transparent'}`}><Icons.Check /></div>
                                            <span className={`text-sm ${isChecked ? 'text-emerald-700 dark:text-emerald-300 line-through opacity-70' : 'text-slate-700 dark:text-slate-300'}`}>{step}</span>
                                        </div>
                                    );
                                })}
                            </div>
                        </div>
                    ))}
                    <button onClick={onComplete} className="w-full py-3 bg-emerald-600 text-white font-bold rounded-xl mt-4 hover:bg-emerald-500 transition shadow-lg flex items-center justify-center gap-2"><Icons.Check /> Marcar Rutina como Completada</button>
                </div>
            );
        };

        const EvaluationCard = ({ data, onComplete }) => {
            const [selected, setSelected] = useState(null);
            const [showFeedback, setShowFeedback] = useState(false);
            const handleSelect = (idx) => { 
                if (showFeedback) return; setSelected(idx); setShowFeedback(true);
                if (data.options[idx].correct && onComplete) onComplete();
            };
            useEffect(() => { setSelected(null); setShowFeedback(false); }, [data.question]); 
            if (!data) return null;
            return (
                <div className="mt-6 bg-slate-100 dark:bg-slate-950 p-4 rounded-xl border border-slate-200 dark:border-slate-800">
                    <div className="flex items-center gap-2 mb-3"><span className="bg-indigo-100 text-indigo-700 dark:bg-indigo-900 dark:text-indigo-300 p-1 rounded"><Icons.Check /></span><h3 className="font-bold text-sm text-slate-800 dark:text-slate-200">Evaluación Rápida</h3></div>
                    <p className="text-sm font-medium mb-3 text-slate-700 dark:text-slate-300">{data.question}</p>
                    <div className="space-y-2">
                        {data.options.map((opt, idx) => {
                            let itemClass = "w-full text-left p-3 rounded-lg text-xs font-bold transition flex justify-between items-center ";
                            if (showFeedback) {
                                if (idx === selected) itemClass += opt.correct ? "bg-emerald-100 text-emerald-800 border-2 border-emerald-500" : "bg-red-100 text-red-800 border-2 border-red-500";
                                else if (opt.correct) itemClass += "bg-emerald-50 text-emerald-600 border border-emerald-200 opacity-70"; 
                                else itemClass += "bg-white dark:bg-slate-800 text-slate-400 opacity-50";
                            } else itemClass += "bg-white dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-indigo-50 dark:hover:bg-slate-700 border border-slate-200 dark:border-slate-700";
                            return (<button key={idx} onClick={() => handleSelect(idx)} className={itemClass} disabled={showFeedback}>{opt.text}{showFeedback && idx === selected && (opt.correct ? <Icons.Check /> : <Icons.X />)}</button>);
                        })}
                    </div>
                    {showFeedback && (<div className={`mt-3 text-xs p-2 rounded ${data.options[selected].correct ? 'text-emerald-700 bg-emerald-50' : 'text-red-700 bg-red-50'}`}><strong>Retroalimentación: </strong> {data.options[selected].feedback}</div>)}
                </div>
            );
        };

        const QuizMode = ({ data, onComplete }) => {
            const [currentQ, setCurrentQ] = useState(0);
            const [score, setScore] = useState(0);
            const [finished, setFinished] = useState(false);
            const [selected, setSelected] = useState(null);
            const [showFeedback, setShowFeedback] = useState(false);
            const handleSelect = (idx) => { if (showFeedback) return; setSelected(idx); setShowFeedback(true); if (data.questions[currentQ].options[idx].correct) setScore(score + 1); };
            const handleNext = () => {
                if (currentQ < data.questions.length - 1) { setCurrentQ(currentQ + 1); setSelected(null); setShowFeedback(false); } 
                else { setFinished(true); if ((score / data.questions.length) >= 0.6 && onComplete) onComplete(); }
            };
            const resetQuiz = () => { setCurrentQ(0); setScore(0); setFinished(false); setSelected(null); setShowFeedback(false); };
            if (finished) return (
                <div className="bg-white dark:bg-slate-900 p-8 rounded-2xl shadow-lg text-center animate-fade-in border border-slate-200 dark:border-slate-800">

            const q = data.questions[currentQ];
            return (
                <div className="bg-white dark:bg-slate-900 p-6 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-800 animate-fade-in">
                    <div className="flex justify-between items-center mb-4"><span className="text-xs font-bold text-slate-400 uppercase tracking-wider">Pregunta {currentQ + 1} de {data.questions.length}</span><span className="text-xs font-bold text-emerald-500 bg-emerald-50 dark:bg-emerald-900/30 px-2 py-1 rounded">Puntos: {score}</span></div>
                    <h3 className="text-lg font-bold text-slate-800 dark:text-white mb-6 leading-snug">{q.question}</h3>
                    <div className="space-y-3 mb-6">{q.options.map((opt, idx) => (
                        <button key={idx} onClick={() => handleSelect(idx)} className={`w-full text-left p-4 rounded-xl text-sm font-medium transition border-2 flex justify-between items-center ${showFeedback ? (idx === selected ? (opt.correct ? "bg-emerald-50 border-emerald-500 text-emerald-700" : "bg-red-50 border-red-500 text-red-700") : (opt.correct ? "bg-emerald-50 border-emerald-200 text-emerald-600 opacity-70" : "border-transparent bg-slate-50 dark:bg-slate-800 text-slate-400 opacity-50")) : "bg-slate-50 dark:bg-slate-800 border-transparent hover:border-indigo-200 text-slate-700 dark:text-slate-200"}`} disabled={showFeedback}>{opt.text}{showFeedback && idx === selected && (opt.correct ? <Icons.Check /> : <Icons.X />)}</button>
                    ))}</div>
                    {showFeedback && (<div className="animate-fade-in"><div className={`text-sm p-4 rounded-xl mb-4 ${q.options[selected].correct ? 'bg-emerald-50 text-emerald-800 dark:bg-emerald-900/20 dark:text-emerald-300' : 'bg-red-50 text-red-800 dark:bg-red-900/20 dark:text-red-300'}`}><p className="font-bold mb-1">{q.options[selected].correct ? '¡Correcto!' : 'Incorrecto'}</p><p className="opacity-90">{q.options[selected].feedback}</p></div><button onClick={handleNext} className="w-full py-3 bg-indigo-600 text-white rounded-xl font-bold hover:bg-indigo-700 transition flex items-center justify-center gap-2">{currentQ < data.questions.length - 1 ? 'Siguiente Pregunta' : 'Ver Resultados'} <Icons.Play /></button></div>)}
                </div>

        };

        const PlayerView = ({ displayInfo }) => {
            const R = 24; const offset = 2 * R * Math.sin(displayInfo.rad || 0); const shiftX = (displayInfo.dir || 1) * offset;
            return (
                <div className="flex flex-col items-center bg-slate-800 p-2 rounded-lg border border-slate-700 w-24">
                    <span className="text-[9px] text-slate-400 uppercase font-bold mb-1">Vista Jugador</span>
                    <svg width="60" height="60" viewBox="-30 -30 60 60" className="overflow-visible">
                        <circle cx="0" cy="0" r={R} fill="#ef4444" stroke="#991b1b" strokeWidth="1" />
                        <circle cx={-shiftX} cy="0" r={R} fill="white" fillOpacity="0.4" stroke="white" strokeWidth="1" strokeDasharray="3,2" />
                        <line x1={-shiftX} y1={-R} x2={-shiftX} y2={R} stroke="white" strokeWidth="0.5" opacity="0.5" />
                    </svg>
                </div>
            );
        };

        const SmartSimulator = ({ onLoadDrill }) => {
            const TABLE_W = 600, TABLE_H = 300, BALL_R = 12, PLAY_AREA_MARGIN = BALL_R; 
            const POCKETS = [{x:0,y:0}, {x:300,y:0}, {x:600,y:0}, {x:0,y:300}, {x:300,y:300}, {x:600,y:300}];
            const [cb, setCb] = useState({ x: 150, y: 150 });
            const [ob, setOb] = useState({ x: 400, y: 150 });
            const [aim, setAim] = useState({ x: 600, y: 150 });
            const [shooting, setShooting] = useState(false);
            const [cbV, setCbV] = useState({x:0, y:0});
            const [obV, setObV] = useState({x:0, y:0});
            const [shotPower, setShotPower] = useState(3);
            const startObPos = useRef({ x: 0, y: 0 });
            const startCbPos = useRef({ x: 0, y: 0 });
            const [fixedAngle, setFixedAngle] = useState(null);
            const [cutSide, setCutSide] = useState(1);
            const [showScenarios, setShowScenarios] = useState(false);
            const [displayInfo, setDisplayInfo] = useState({ deg: 0, name: 'Llena', frac: '1/1', rad: 0 });
            const [isValid, setIsValid] = useState(true);
            const [showGhost, setShowGhost] = useState(true);
            const [showTangent, setShowTangent] = useState(true);
            const [isLeftHanded, setIsLeftHanded] = useState(false);
            const [stats, setStats] = useState({ hits: 0, misses: 0 }); 
            const [manualAngle, setManualAngle] = useState(""); 
            const shotProcessed = useRef(false);
            const svgRef = useRef(null);
            const dragging = useRef(null);
            const scenarios = [
                { name: "Recto a Esquina Sup", cb: {x:450, y:150}, ob:{x:550, y:50}, aim:{x:600, y:0} },
                { name: "Recto al Centro", cb: {x:300, y:200}, ob:{x:300, y:50}, aim:{x:300, y:0} },
                { name: "Corte 30°", cb: {x:250, y:186}, ob:{x:400, y:100}, aim:{x:600, y:0} },
                { name: "Fina 60°", cb: {x:200, y:100}, ob:{x:500, y:100}, aim:{x:600, y:0} },
                { name: "Largo Diagonal", cb: {x:50, y:280}, ob:{x:550, y:20}, aim:{x:600, y:0} },
                { name: "Pegada a Banda", cb: {x:300, y:200}, ob:{x:450, y:288}, aim:{x:600, y:288} }
            ];

            useEffect(() => { if(onLoadDrill) onLoadDrill.current = (s) => { if(s){ setCb(s.cb); setOb(s.ob); setAim(s.aim); setFixedAngle(null); setShooting(false); setCbV({x:0,y:0}); setObV({x:0,y:0}); } }; }, [onLoadDrill]);
            const loadScenario = (s) => { setCb(s.cb); setOb(s.ob); setAim(s.aim); setFixedAngle(null); setShowScenarios(false); setShooting(false); setCbV({x:0,y:0}); setObV({x:0,y:0}); };
            const getCutName = (deg) => {
                const rad = deg * Math.PI / 180; const fractionVal = 1 - Math.sin(rad); let name = "MANUAL"; let frac = fractionVal.toFixed(2);
                if (deg < 3) { name = "LLENA"; frac = "1/1"; } else if (Math.abs(deg - 14.5) < 4) { name = "3/4 BOLA"; frac = "3/4"; } else if (Math.abs(deg - 30) < 4) { name = "MEDIA"; frac = "1/2"; } else if (Math.abs(deg - 48.6) < 4) { name = "1/4 BOLA"; frac = "1/4"; } else if (Math.abs(deg - 61) < 4) { name = "FINA"; frac = "1/8"; }
                return { name, frac, rad };
            };
            const calculateVectors = (c, o, a) => {
                const dxOB = a.x - o.x, dyOB = a.y - o.y; const dOB = Math.sqrt(dxOB*dxOB + dyOB*dyOB) || 1;
                const ux = dxOB/dOB, uy = dyOB/dOB; const gbX = o.x - (ux * BALL_R * 2), gbY = o.y - (uy * BALL_R * 2);
                const dxAtt = gbX - c.x, dyAtt = gbY - c.y; const ax = dxAtt/(Math.sqrt(dxAtt*dxAtt+dyAtt*dyAtt)||1), ay = dyAtt/(Math.sqrt(dxAtt*dxAtt+dyAtt*dyAtt)||1);
                const dot = ax * ux + ay * uy; const rad = Math.acos(Math.max(-1, Math.min(1, dot))); const deg = (rad * 180) / Math.PI;
                const cross = ax * uy - ay * ux; const dir = cross < 0 ? 1 : -1; const tx = -uy * dir, ty = ux * dir; const tanX = -uy * 200; const tanY = ux * 200;
                return { gbX, gbY, deg, rad, tx, ty, ux, uy, dir, tanX, tanY };
            };
            const updateSimulation = (c, o, a) => {
                const data = calculateVectors(c, o, a); const info = getCutName(data.deg); setDisplayInfo({ deg: data.deg, name: info.name, frac: info.frac, rad: data.rad, dir: data.dir }); 
                const m = PLAY_AREA_MARGIN; setIsValid(c.x >= m && c.x <= TABLE_W-m && c.y >= m && c.y <= TABLE_H-m && o.x >= m && o.x <= TABLE_W-m && o.y >= m && o.y <= TABLE_H-m && data.deg <= 88);
            };
            useEffect(() => { if(!shooting) updateSimulation(cb, ob, aim); }, [cb, ob, aim, shooting]);
            
            const applyPreset = (deg, forceToggle = false) => {
                let newSide = cutSide; if (fixedAngle === deg || forceToggle) newSide = cutSide * -1; setFixedAngle(deg); setCutSide(newSide);
                const dx = aim.x - ob.x, dy = aim.y - ob.y; const dOB = Math.sqrt(dx*dx + dy*dy) || 1; const ux = dx/dOB, uy = dy/dOB;
                const gbX = ob.x - (ux * BALL_R * 2), gbY = ob.y - (uy * BALL_R * 2); const impactAngle = Math.atan2(uy, ux);
                const rad = (deg * Math.PI / 180); const approachAngle = impactAngle + Math.PI + (rad * newSide);
                let dist = 200; let nx = gbX + dist * Math.cos(approachAngle); let ny = gbY + dist * Math.sin(approachAngle);
                const m = PLAY_AREA_MARGIN; if(nx < m || nx > TABLE_W-m || ny < m || ny > TABLE_H-m) { dist = 100; nx = gbX + dist * Math.cos(approachAngle); ny = gbY + dist * Math.sin(approachAngle); }
                nx = Math.max(m, Math.min(TABLE_W-m, nx)); ny = Math.max(m, Math.min(TABLE_H-m, ny)); setCb({ x: nx, y: ny });
            };

            const handleManualAngle = (e) => {
                const val = parseFloat(e.target.value);
                setManualAngle(e.target.value);
                if (!isNaN(val) && val >= 0 && val <= 90) {
                    applyPreset(val, true);
                }
            };

            useEffect(() => { if (fixedAngle !== null && dragging.current !== 'cb' && !shooting) { applyPreset(fixedAngle); } }, [ob, aim]);
            
            const handleDrag = (e, type) => {
                if (!dragging.current || shooting) return;
                const CTM = svgRef.current.getScreenCTM(); const isTouch = e.type.includes('touch'); const clientX = isTouch ? e.touches[0].clientX : e.clientX; const clientY = isTouch ? e.touches[0].clientY : e.clientY;
                const x = (clientX - CTM.e) / CTM.a; const y = (clientY - CTM.f) / CTM.d; const p = BALL_R; const cx = Math.max(p, Math.min(TABLE_W-p, x)); const cy = Math.max(p, Math.min(TABLE_H-p, y));
                if (dragging.current === 'cb') { setCb({x:cx, y:cy}); setFixedAngle(null); setManualAngle(""); } else if (dragging.current === 'ob') { const dx = aim.x - ob.x, dy = aim.y - ob.y; setOb({x:cx, y:cy}); setAim({x:cx+dx, y:cy+dy}); } else if (dragging.current === 'aim') { setAim({x: x, y: y}); } 
            };
            const startDrag = (e, type) => { if(shooting) return; e.preventDefault(); dragging.current = type; document.addEventListener('mousemove', handleDrag); document.addEventListener('touchmove', handleDrag, {passive: false}); document.addEventListener('mouseup', stopDrag); document.addEventListener('touchend', stopDrag); };
            const stopDrag = () => { dragging.current = null; document.removeEventListener('mousemove', handleDrag); document.removeEventListener('touchmove', handleDrag); document.removeEventListener('mouseup', stopDrag); document.removeEventListener('touchend', stopDrag); };
            
            const startShot = () => {
                if (shooting) return; 
                startObPos.current = { ...ob }; 
                startCbPos.current = { ...cb };
                shotProcessed.current = false; 
                const v = calculateVectors(cb, ob, aim); const dx = v.gbX - cb.x; const dy = v.gbY - cb.y; const dist = Math.sqrt(dx*dx + dy*dy); const speedMap = [0, 6, 12, 18, 24, 32]; const power = speedMap[shotPower]; 
                setCbV({ x: (dx/dist) * power, y: (dy/dist) * power }); setObV({ x: 0, y: 0 }); setShooting(true);
            };
            
            const resetShot = () => { setShooting(false); setCbV({x:0, y:0}); setObV({x:0, y:0}); };
            const stateRef = useRef({ cb, ob, cbV, obV, shooting });
            useEffect(() => { stateRef.current = { cb, ob, cbV, obV, shooting }; }, [cb, ob, cbV, obV, shooting]);
            
            useEffect(() => {
                if (!shooting) return;
                let animId;
                const loop = () => {
                    let { cb, ob, cbV, obV } = stateRef.current;
                    let nextCb = { x: cb.x + cbV.x, y: cb.y + cbV.y }; let nextOb = { x: ob.x + obV.x, y: ob.y + obV.y }; let nextCbV = { ...cbV }; let nextObV = { ...obV };
                    nextCbV.x *= 0.98; nextCbV.y *= 0.98; nextObV.x *= 0.98; nextObV.y *= 0.98;
                    if(Math.abs(nextCbV.x) < 0.05 && Math.abs(nextCbV.y) < 0.05) nextCbV = {x:0, y:0}; if(Math.abs(nextObV.x) < 0.05 && Math.abs(nextObV.y) < 0.05) nextObV = {x:0, y:0};
                    const p = BALL_R;
                    if(nextCb.x < p) { nextCb.x = p; nextCbV.x *= -1; } else if(nextCb.x > TABLE_W-p) { nextCb.x = TABLE_W-p; nextCbV.x *= -1; }
                    if(nextCb.y < p) { nextCb.y = p; nextCbV.y *= -1; } else if(nextCb.y > TABLE_H-p) { nextCb.y = TABLE_H-p; nextCbV.y *= -1; }
                    if(nextOb.x > -50) { if(nextOb.x < p) { nextOb.x = p; nextObV.x *= -1; } else if(nextOb.x > TABLE_W-p) { nextOb.x = TABLE_W-p; nextObV.x *= -1; } if(nextOb.y < p) { nextOb.y = p; nextObV.y *= -1; } else if(nextOb.y > TABLE_H-p) { nextOb.y = TABLE_H-p; nextObV.y *= -1; } }
                     
                    POCKETS.forEach(pkt => {
                        if (Math.hypot(nextCb.x - pkt.x, nextCb.y - pkt.y) < 30) { 
                            playSound('success'); nextCb = { ...startCbPos.current }; nextCbV = {x:0,y:0}; 
                            if (!shotProcessed.current) { setStats(s => ({...s, misses: s.misses + 1})); shotProcessed.current = true; }
                        }
                        if (Math.hypot(nextOb.x - pkt.x, nextOb.y - pkt.y) < 30) { 
                            playSound('success'); nextOb = { ...startObPos.current }; nextObV = {x:0, y:0}; 
                            if (!shotProcessed.current) { setStats(s => ({...s, hits: s.hits + 1})); shotProcessed.current = true; }
                        }
                    });

                    const dx = nextOb.x - nextCb.x; const dy = nextOb.y - nextCb.y; const dist = Math.hypot(dx, dy);
                    if (dist < BALL_R * 2 && dist > 0 && nextOb.x > 0 && nextCb.x > 0) {
                         const nx = dx / dist; const ny = dy / dist; const dvx = nextCbV.x - nextObV.x; const dvy = nextCbV.y - nextObV.y; const dot = dvx * nx + dvy * ny;
                         if (dot > 0) { nextCbV.x -= dot * nx; nextCbV.y -= dot * ny; nextObV.x += dot * nx; nextObV.y += dot * ny; const overlap = (BALL_R * 2 - dist) / 2; nextCb.x -= overlap * nx; nextCb.y -= overlap * ny; nextOb.x += overlap * nx; nextOb.y += overlap * ny; playSound('hit'); }
                    }
                    setCb(nextCb); setOb(nextOb); setCbV(nextCbV); setObV(nextObV);
                    
                    if (nextCbV.x === 0 && nextCbV.y === 0 && nextObV.x === 0 && nextObV.y === 0) { 
                        setShooting(false); 
                        if (!shotProcessed.current) { setStats(s => ({...s, misses: s.misses + 1})); shotProcessed.current = true; }
                    } else { 
                        animId = requestAnimationFrame(loop); 
                    }
                };
                animId = requestAnimationFrame(loop); return () => cancelAnimationFrame(animId);
            }, [shooting]);
            const v = calculateVectors(cb, ob, aim); const sysColor = isValid ? "#ffffff" : "#ef4444";
            
            return (
                <div className={`flex flex-col gap-4 animate-fade-in ${isLeftHanded ? 'items-end' : ''}`}>
                    <div className="flex flex-wrap justify-between w-full mb-2 gap-2">
                            <div className="flex gap-2">
                                <button onClick={()=>setShowGhost(!showGhost)} className={`px-2 py-1 text-[10px] uppercase font-bold rounded border transition ${showGhost ? 'bg-emerald-600 text-white border-emerald-500' : 'text-slate-400 border-slate-700'}`}>Bola Fantasma</button>
                                <button onClick={()=>setShowTangent(!showTangent)} className={`px-2 py-1 text-[10px] uppercase font-bold rounded border transition ${showTangent ? 'bg-emerald-600 text-white border-emerald-500' : 'text-slate-400 border-slate-700'}`}>Tangente</button>
                            </div>
                            
                            {/* --- ESTADÍSTICAS Y RESET --- */}
                            <div className="flex items-center gap-2 bg-slate-800 rounded px-2 border border-slate-700">
                                <div className="flex flex-col items-center"><span className="text-[8px] text-slate-400 uppercase">Aciertos</span><span className="text-emerald-400 font-bold text-xs">{stats.hits}</span></div>
                                <div className="w-px h-6 bg-slate-700"></div>
                                <div className="flex flex-col items-center"><span className="text-[8px] text-slate-400 uppercase">Fallos</span><span className="text-red-400 font-bold text-xs">{stats.misses}</span></div>
                                <button onClick={() => setStats({hits:0, misses:0})} className="ml-1 text-slate-500 hover:text-white" title="Reiniciar Conteo"><Icons.Refresh /></button>
                            </div>

                            <div className="flex gap-2">
                                <button onClick={()=>setShowScenarios(!showScenarios)} className="px-2 py-1 text-[10px] uppercase font-bold rounded border bg-indigo-600 text-white border-indigo-500 flex items-center gap-1"><Icons.Folder /> Cargar</button>
                                <button onClick={()=>setIsLeftHanded(!isLeftHanded)} className="text-slate-400 text-xs p-1 hover:bg-white/10 rounded"><Icons.Settings /></button>
                            </div>
                    </div>
                    {showScenarios && <div className="grid grid-cols-2 gap-2 mb-2 p-2 bg-slate-800 rounded-lg">{scenarios.map((s,i) => <button key={i} onClick={()=>loadScenario(s)} className="text-left text-[10px] p-2 bg-slate-700 hover:bg-slate-600 rounded text-slate-200">{s.name}</button>)}</div>}
                    <div className="relative rounded-lg overflow-hidden border-4 border-slate-700 shadow-2xl bg-stone-900 w-full" style={{direction: isLeftHanded ? 'rtl' : 'ltr'}}>
                        <svg ref={svgRef} viewBox="-20 -20 640 340" className="w-full h-auto bg-[#15803d] touch-none cursor-crosshair">
                            <rect x="0" y="0" width="600" height="300" fill="none" stroke="#0f5132" strokeWidth="2" />
                            {[0,300,600].map(x => [0,300].map(y => <circle key={`${x}-${y}`} cx={x} cy={y} r="20" fill="#111" />))}
                            {[1,2,3,5,6,7].map(i => <circle key={`d-${i}`} cx={i*75} cy={-10} r="3" fill="#ccc" />)}
                            {!shooting && <line x1={ob.x} y1={ob.y} x2={aim.x} y2={aim.y} stroke="#fff" strokeDasharray="5,5" opacity="0.4" />}
                            {!shooting && showGhost && <circle cx={v.gbX} cy={v.gbY} r="12" fill="none" stroke="#fff" strokeDasharray="3,2" opacity="0.6" />}
                            {!shooting && showTangent && <line x1={v.gbX - v.tanX} y1={v.gbY - v.tanY} x2={v.gbX + v.tanX} y2={v.gbY + v.tanY} stroke="#ffff00" strokeWidth="2" opacity="0.5" />}
                            {!shooting && <line x1={cb.x} y1={cb.y} x2={v.gbX} y2={v.gbY} stroke={sysColor} strokeWidth="2" opacity="0.6" />}
                            <g transform={`translate(${ob.x},${ob.y})`} onMouseDown={(e)=>startDrag(e,'ob')} onTouchStart={(e)=>startDrag(e,'ob')} className={shooting ? '' : "cursor-move"}><circle r="30" fill="transparent" /><circle r="12" fill="#ef4444" stroke="#991b1b" /></g>
                            {!shooting && <g transform={`translate(${aim.x},${aim.y})`} onMouseDown={(e)=>startDrag(e,'aim')} onTouchStart={(e)=>startDrag(e,'aim')} className="cursor-move"><circle r="20" fill="transparent" /><circle r="8" fill="none" stroke="#00ff00" strokeWidth="2" /></g>}
                            <g transform={`translate(${cb.x},${cb.y})`} onMouseDown={(e)=>startDrag(e,'cb')} onTouchStart={(e)=>startDrag(e,'cb')} className={shooting ? '' : "cursor-move"}><circle r="30" fill="transparent" /><circle r="12" fill="white" stroke="#ddd" /></g>
                        </svg>

                                />
                            </div>
                            <div className="flex justify-between items-center text-[10px] uppercase font-bold text-slate-400"><span>Corte</span><span className="text-yellow-400">{displayInfo.name}</span></div>
                            <div className="flex justify-between items-center text-[10px] uppercase font-bold text-slate-400 mt-1"><span>Fracción</span><span className="text-emerald-400 font-mono">{displayInfo.frac}</span></div>
                        </div>
                        <PlayerView displayInfo={displayInfo} />
                        <div className="flex-1 bg-slate-900 p-2 rounded-lg border border-slate-700 flex flex-col justify-between h-24">
                            <div className="flex justify-between mb-1">{[1,2,3,4,5].map(v => (<button key={v} onClick={()=>setShotPower(v)} className={`w-5 h-8 rounded text-[10px] font-bold transition ${shotPower === v ? 'bg-amber-500 text-white' : 'bg-slate-700 text-slate-400 hover:bg-slate-600'}`}>{v}</button>))}</div>

        const TrainerV7 = () => {

            const [isRunning, setIsRunning] = useState(false); const [bpm, setBpm] = useState(60); const [reps, setReps] = useState(10); const [force, setForce] = useState("120|0.20"); const [m3Beats, setM3Beats] = useState(4); const [useM1, setUseM1] = useState(true); const [useM2, setUseM2] = useState(true); const [uiState, setUiState] = useState({ m: 1, b: 0, s: 1 });
            const P_GAP = 8; const P_FEATHER_DIST = 50; const P_THROUGH_DIST = 160;
            const playAudio = (type) => {
                const AudioContext = window.AudioContext || window.webkitAudioContext; if (!AudioContext) return; if (!audioCtx.current) audioCtx.current = new AudioContext(); if (audioCtx.current.state === 'suspended') audioCtx.current.resume();
                const ctx = audioCtx.current; const osc = ctx.createOscillator(); const gain = ctx.createGain(); osc.connect(gain); gain.connect(ctx.destination); const now = ctx.currentTime;
                if (type === 'tick') { osc.frequency.value = 800; osc.type = 'square'; gain.gain.setValueAtTime(0.08, now); gain.gain.exponentialRampToValueAtTime(0.001, now+0.05); } else if (type === 'measure-start') { osc.frequency.value = 1200; osc.type = 'square'; gain.gain.setValueAtTime(0.12, now); gain.gain.exponentialRampToValueAtTime(0.001, now+0.08); } else if (type === 'hit') { osc.frequency.value = 150; osc.type = 'sawtooth'; gain.gain.setValueAtTime(0.3, now); gain.gain.exponentialRampToValueAtTime(0.001, now+0.15); } 
                osc.start(now); osc.stop(now+0.2);
            };
            const setText = (main, sub) => { if(mainTextRef.current) mainTextRef.current.textContent = main; if(subTextRef.current) subTextRef.current.textContent = sub; };
            const setCue = (x, duration, ease = 'linear') => { if(cueRef.current) { cueRef.current.style.transition = `transform ${duration}s ${ease}`; cueRef.current.style.transform = `translateX(${x}px)`; } };
            const runVisuals = (m, b, s) => {
                setUiState({ m, b, s }); const secPerBeat = 60/bpm;
                if (m === 1) { setCue(-P_GAP, 0); const texts = ["1. VISUALIZA", "RESPIRA", "ENFOCA", "LISTO"]; const subs = ["Mente en silencio.", "Inhala profundo.", "Ojos en la bola.", "Prepárate."]; if(b <= 4) setText(texts[b-1], subs[b-1]); }
                else if (m === 2) { setCue(-P_GAP, 0); const texts = ["PASO DERECHO", "PASO IZQUIERDO", "AGACHADO", "PUENTE"]; const subs = ["Pie en línea.", "Abre base.", "Barbilla al taco.", "Agarre suave."]; if(b <= 4) setText(texts[b-1], subs[b-1]); }
                else if (m === 3) { const isBack = (b % 2 !== 0); if (isBack) { setText("LIMADO ATRÁS", "Suave, sin apretar."); setCue(-(P_GAP + P_FEATHER_DIST), secPerBeat, 'ease-in-out'); } else { setText("LIMADO ADELANTE", "Acércate SIN tocar."); setCue(-P_GAP, secPerBeat, 'ease-in-out'); } if (b === m3Beats) setText("LISTO PARA TIRAR", "Última pausa."); }
                else if (m === 4) { const [dist, time] = force.split('|').map(Number); if(b===1) { setText("4. BACKSWING FINAL", "Atrás... Distancia."); setCue(-(P_GAP + dist), secPerBeat, 'ease-out'); } else if(b===2) { setText("¡¡ PAUSA !!", "Quieto."); } else if(b===3) { setText("¡¡ GOLPE !!", "Suelta el brazo."); setCue(P_THROUGH_DIST, time, 'cubic-bezier(0.22, 0.61, 0.36, 1)'); } else if(b===4) { setText("FREEZE", "Quédate abajo."); } }
            };
            const advanceMeasure = (currentM, currentS) => { let nextM = currentM + 1; let nextS = currentS; if (nextM > 4) { nextM = 1; nextS++; } if (nextM === 1 && !useM1) nextM = 2; if (nextM === 2 && !useM2) nextM = 3; return { nextM, nextS }; };
            const stateRef = useRef({ m: 1, b: 0, s: 1 });
            const scheduleNote = (m, b, s, time) => { const delay = Math.max(0, (time - audioCtx.current.currentTime) * 1000); setTimeout(() => { if (!isRunning && s > 1) return; runVisuals(m, b, s); if (m === 4 && b === 3) playAudio('hit'); else if (b === 1) playAudio('measure-start'); else playAudio('tick'); }, delay); };
            const nextNote = () => { const secondsPerBeat = 60.0 / bpm; nextNoteTime.current += secondsPerBeat; stateRef.current.b++; let beatsInMeasure = 4; if (stateRef.current.m === 3) beatsInMeasure = m3Beats; if (stateRef.current.b > beatsInMeasure) { stateRef.current.b = 1; const { nextM, nextS } = advanceMeasure(stateRef.current.m, stateRef.current.s); stateRef.current.m = nextM; stateRef.current.s = nextS; } };
            const scheduler = () => { if (!isRunning) return; while (nextNoteTime.current < audioCtx.current.currentTime + 0.1) { if (stateRef.current.s > reps) { setIsRunning(false); setText("¡SERIE COMPLETADA!", "Descansa."); return; } scheduleNote(stateRef.current.m, stateRef.current.b, stateRef.current.s, nextNoteTime.current); nextNote(); } timerID.current = requestAnimationFrame(scheduler); };
            useEffect(() => { if (isRunning) { const AudioContext = window.AudioContext || window.webkitAudioContext; if (!AudioContext) return; if (!audioCtx.current) audioCtx.current = new AudioContext(); if (audioCtx.current.state === 'suspended') audioCtx.current.resume(); nextNoteTime.current = audioCtx.current.currentTime + 0.1; stateRef.current = { m: useM1 ? 1 : (useM2 ? 2 : 3), b: 0, s: 1 }; scheduler(); } else { cancelAnimationFrame(timerID.current); } return () => cancelAnimationFrame(timerID.current); }, [isRunning]);
            return (
                <div className="flex flex-col items-center w-full max-w-3xl mx-auto p-2">
                    <div className="absolute top-20 right-4 bg-black/60 px-3 py-1 rounded-full border border-emerald-500 text-white font-mono text-xs z-50">TIRO: {uiState.s} {reps > 0 ? `/ ${reps}` : ''}</div>
                    <div className="text-center mb-4 h-16"><div ref={mainTextRef} className="text-2xl font-black text-yellow-400 drop-shadow-md tracking-wider">ENTRENADOR DE RITMO</div><div ref={subTextRef} className="text-sm text-slate-400">Física de aceleración por distancia</div></div>

            { id: 'quiz', title: '6. Examen', icon: <Icons.Quiz />, isQuiz: true, content: { summary: "Evaluación Final Técnica.", questions: [{ question: "¿Cuál es el propósito principal de mantener la barbilla baja, casi tocando el taco?", options: [{ text: "Comodidad", correct: false, feedback: "No es por comodidad, aunque debe ser sostenible." }, { text: "Reducir error de paralaje", correct: true, feedback: "¡Correcto! Al acercar los ojos a la línea del taco, ves la línea real sin distorsión angular." }, { text: "Proteger el cuello", correct: false, feedback: "Incorrecto." }] }, { question: "¿Qué sucede biomecánicamente si agarras el taco con toda la palma de la mano?", options: [{ text: "Bloqueas la muñeca", correct: true, feedback: "¡Correcto! El agarre de palma completa ('Death Grip') impide el muñequeo natural, reduciendo fluidez y precisión." }, { text: "Aumentas la fuerza", correct: false, feedback: "Falso, la tensión reduce la velocidad final." }, { text: "Mejoras el control", correct: false, feedback: "Falso, pierdes sensibilidad." }] }, { question: "En la alineación, ¿cuál es el error más grave al entrar a la mesa?", options: [{ text: "Entrar rápido", correct: false, feedback: "No es ideal, pero no es el peor error." }, { text: "Ajustar el cuerpo ya agachado", correct: true, feedback: "¡Crítico! Si te mueves lateralmente estando abajo, pierdes la línea de visión que estableciste de pie." }, { text: "No usar tiza", correct: false, feedback: "Es un error, pero de equipo, no de alineación corporal." }] }, { question: "¿Por qué el codo debe ser el único punto de pivote en el swing?", options: [{ text: "Estética", correct: false, feedback: "No." }, { text: "Potencia", correct: false, feedback: "La potencia viene de la aceleración, no solo del codo." }, { text: "Consistencia lineal", correct: true, feedback: "¡Correcto! Si el codo sube o baja (pistoneo), la punta del taco se mueve verticalmente, causando pifias." }] }, { question: "Si golpeas la bola blanca en el centro geométrico contra una bola objetivo cortada, ¿qué hace la blanca?", options: [{ text: "Se detiene", correct: false, feedback: "Solo en tiro recto." }, { text: "Sigue la línea tangente (90°)", correct: true, feedback: "¡Ley Física! Sin rotación (stun), la blanca siempre sale a 90 grados de la línea de impacto." }, { text: "Sigue adelante", correct: false, feedback: "Necesitaría efecto corrido." }] }, { question: "¿Qué define un 'puente' sólido?", options: [{ text: "Presión fuerte de la palma", correct: false, feedback: "La palma a veces ni toca." }, { text: "Yemas de los dedos presionando el paño", correct: true, feedback: "¡Exacto! La estabilidad viene de los dedos anclados y el pulgar firme contra el índice." }, { text: "Levantar el pulgar", correct: false, feedback: "Eso es un puente abierto inestable." }] }, { question: "¿Cuándo debes soltar el aire (exhalar) en el tiro?", options: [{ text: "Antes de agacharte", correct: false, feedback: "Muy pronto." }, { text: "Durante el golpe final", correct: true, feedback: "¡Sí! O mantener una pausa respiratoria natural. Nunca inhalar al golpear, pues levanta el pecho." }, { text: "Después de que la bola entre", correct: false, feedback: "Tarde." }] }, { question: "Para un tiro largo y recto, ¿dónde debes mirar al momento del impacto?", options: [{ text: "A la bola blanca", correct: false, feedback: "Común en novatos, pero incorrecto para precisión lejana." }, { text: "A la bola objetivo (Object Ball)", correct: true, feedback: "¡Correcto! Tus ojos guían la mano. Fija la vista en el punto de contacto de la bola objetivo." }, { text: "Al taco", correct: false, feedback: "Nunca mires el taco." }] }, { question: "¿Qué efecto tiene levantar el cuerpo antes de terminar el tiro?", options: [{ text: "Ninguno", correct: false, feedback: "Falso." }, { text: "Desvía el taco", correct: true, feedback: "¡Sí! Levantar el cuerpo suele levantar el hombro y, por ende, la punta del taco, causando fallos." }, { text: "Ayuda a ver mejor", correct: false, feedback: "Ves mejor el fallo, nada más." }] }, { question: "En física de billar, ¿qué es la 'Bola Fantasma'?", options: [{ text: "Una bola imaginaria en el punto de impacto", correct: true, feedback: "¡Concepto Clave! Imaginas dónde debería estar la blanca al tocar la objetivo para enviarla a la tronera." }, { text: "Una bola que se mueve sola", correct: false, feedback: "No." }, { text: "El reflejo en la banda", correct: false, feedback: "Eso es sistema de diamantes/espejos." }] }] } },
            { id: 'trainer7', title: '7. Ritmo', icon: <Icons.Activity />, isTrainer: true }
        ];

        const UserLogin = ({ onLogin, users, setUsers }) => {
            const [newUser, setNewUser] = useState(''); const [view, setView] = useState('menu'); const fileInputRef = useRef(null);
            const ballColors = ['#facc15', '#1d4ed8', '#ef4444', '#7e22ce', '#f97316', '#15803d', '#881337', '#000000'];
            const handleAddUser = () => { if (newUser.trim()) { const newUserData = { name: newUser.trim(), id: Date.now(), progress: {} }; const updated = [...users, newUserData]; setUsers(updated); saveToLocal('tm_users', updated); setNewUser(''); setView('list'); } };
            const handleDeleteUser = (id, e) => { e.stopPropagation(); if (window.confirm("¿Borrar usuario?")) { const updated = users.filter(u => u.id !== id); setUsers(updated); saveToLocal('tm_users', updated); } };
            const handleImportClick = () => fileInputRef.current && fileInputRef.current.click();
            const handleImportFile = (event) => { const file = event.target.files[0]; if (!file) return; const reader = new FileReader(); reader.onload = (e) => { try { const imported = JSON.parse(e.target.result); setUsers(imported); saveToLocal('tm_users', imported); alert("Importado!"); } catch (error) { alert("Error"); } }; reader.readAsText(file); };
            const handleExport = () => { const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(users)); const node = document.createElement('a'); node.setAttribute("href", dataStr); node.setAttribute("download", "tiro_maestro_users.json"); document.body.appendChild(node); node.click(); node.remove(); };
            return (
                <div className="min-h-screen flex items-center justify-center wood-texture p-4 relative overflow-hidden">
                    <div className="absolute inset-4 sm:inset-8 rounded-3xl shadow-felt border-8 border-[#2a1e10]/50 animate-felt-cycle felt-bg"></div><div className="absolute top-6 left-1/2 w-2 h-2 bg-white/50 rotate-45 transform -translate-x-1/2 z-0"></div><div className="absolute bottom-6 left-1/2 w-2 h-2 bg-white/50 rotate-45 transform -translate-x-1/2 z-0"></div>
                    <div className="z-10 w-full max-w-2xl flex flex-col items-center"><div className="bg-black/40 backdrop-blur-md px-8 py-4 rounded-full border border-white/10 mb-12 shadow-2xl flex flex-col items-center"><h1 className="text-4xl font-black text-white tracking-tighter drop-shadow-lg">TIRO MAESTRO</h1><span className="text-emerald-400 text-xs font-bold uppercase tracking-[0.3em]">Técnica</span></div>
                        {view === 'menu' && (
                            <div className="flex flex-col items-center w-full"><div className="grid grid-cols-2 md:grid-cols-4 gap-8 justify-items-center mb-8"><BilliardBallBtn color="#facc15" number="1" label="Cargar" onClick={() => setView('list')} /><BilliardBallBtn color="#1d4ed8" subIcon={<Icons.Plus />} label="Crear" onClick={() => setView('add')} /><BilliardBallBtn color="#000000" number="8" label="Invitado" onClick={() => onLogin({ name: "Invitado", isGuest: true })} /><div className="flex flex-col gap-4"><div onClick={handleImportClick} className="cursor-pointer flex flex-col items-center group"><div className="w-12 h-12 rounded-full bg-white border-4 border-red-600 shadow-ball flex items-center justify-center transform group-hover:scale-110 transition"><Icons.Upload /></div><span className="text-[9px] text-white font-bold bg-black/40 px-2 rounded mt-1">Import</span></div><div onClick={handleExport} className="cursor-pointer flex flex-col items-center group"><div className="w-12 h-12 rounded-full bg-white border-4 border-purple-600 shadow-ball flex items-center justify-center transform group-hover:scale-110 transition"><Icons.Download /></div><span className="text-[9px] text-white font-bold bg-black/40 px-2 rounded mt-1">Export</span></div><input type="file" ref={fileInputRef} onChange={handleImportFile} className="hidden" accept=".json" /></div></div>
                                <div className="w-full max-w-lg flex flex-col gap-3"><a href="https://juanmiguel0927.github.io/Pool/" className="w-full bg-emerald-800/90 hover:bg-emerald-700 text-white font-bold py-3 px-4 rounded-lg border-2 border-emerald-400/30 flex items-center justify-between shadow-lg transition group backdrop-blur-sm"><span className="uppercase tracking-widest text-xs">Plan de Entrenamiento</span><div className="bg-white/10 p-1 rounded-full group-hover:translate-x-1 transition-transform"><Icons.ArrowRight /></div></a><a href="https://juanmiguel0927.github.io/ExamenPool/" className="w-full bg-indigo-900/90 hover:bg-indigo-800 text-white font-bold py-3 px-4 rounded-lg border-2 border-indigo-400/30 flex items-center justify-between shadow-lg transition group backdrop-blur-sm"><span className="uppercase tracking-widest text-xs">Examen Pool</span><div className="bg-white/10 p-1 rounded-full group-hover:translate-x-1 transition-transform"><Icons.ArrowRight /></div></a></div>
                            </div>
                        )}
                        {view === 'list' && (<div className="w-full max-w-lg"><div className="flex flex-wrap gap-6 justify-center p-4">{users.map((u, i) => (<div key={u.id || i} className="relative group"><BilliardBallBtn color={ballColors[i % 7]} number={u.name.substring(0,2).toUpperCase()} label={u.name} onClick={() => onLogin(u)} /><button onClick={(e) => handleDeleteUser(u.id, e)} className="absolute -top-1 -right-1 bg-red-500 text-white rounded-full p-1 w-6 h-6 flex items-center justify-center text-xs opacity-0 group-hover:opacity-100 transition shadow-md border border-white"><Icons.Trash /></button></div>))} {users.length === 0 && <p className="text-white font-bold">No hay jugadores.</p>}</div><button onClick={() => setView('menu')} className="mx-auto mt-8 block text-white/70 hover:text-white font-bold uppercase text-xs tracking-widest border-b border-transparent hover:border-white transition">← Volver al Menú</button></div>)}
                        {view === 'add' && (<div className="bg-black/50 backdrop-blur p-6 rounded-2xl border border-white/10 w-full max-w-sm animate-fade-in"><label className="block text-white text-xs font-bold uppercase mb-2">Nombre del Jugador</label><input type="text" value={newUser} onChange={(e) => setNewUser(e.target.value)} className="w-full bg-white/10 border border-white/20 rounded-lg px-4 py-3 text-white placeholder-white/40 focus:outline-none focus:border-emerald-500 mb-4" placeholder="Ej: Efren Reyes" autoFocus /><div className="flex gap-2"><button onClick={() => setView('menu')} className="flex-1 py-3 rounded-lg bg-white/10 text-white font-bold hover:bg-white/20 transition">Cancelar</button><button onClick={handleAddUser} className="flex-1 py-3 rounded-lg bg-emerald-600 text-white font-bold hover:bg-emerald-500 transition shadow-lg">Crear</button></div></div>)}
                        <div className="absolute bottom-8 text-center w-full"><p className="text-[10px] text-white/40 font-medium">Desarrollado por <span className="text-emerald-400">Juan Miguel Rios Redondo</span></p></div>
                    </div>
                </div>
            );
        };

        const App = () => {
            const [dark, setDark] = useState(true);
            const [tab, setTab] = useState('stance');
            const [currentUser, setCurrentUser] = useState(null);
            const [users, setUsers] = useState([]);
            const drillLoader = useRef(null);
            const [notif, setNotif] = useState(null);
            
            useEffect(() => { document.documentElement.className = dark ? 'dark' : ''; const savedUsers = getFromLocal('tm_users'); if (savedUsers) setUsers(savedUsers); }, [dark]);
            const showNotification = (msg) => { setNotif(msg); setTimeout(() => setNotif(null), 3000); };
            const activeData = currentUser ? (getCourseData(currentUser?.progress).find(c => c.id === tab) || getCourseData(currentUser?.progress)[0]) : null;
            const loadDrill = (setup) => { if (tab !== 'physics') setTab('physics'); setTimeout(() => { if (drillLoader.current) drillLoader.current(setup); }, 100); };
            const handleLogout = () => { setCurrentUser(null); };
            const handleProgress = () => { if (currentUser && !currentUser.isGuest) { const newProgress = { ...currentUser.progress, [tab]: true }; const updatedUser = { ...currentUser, progress: newProgress }; const updatedUsers = users.map(u => u.id === updatedUser.id ? updatedUser : u); setCurrentUser(updatedUser); setUsers(updatedUsers); saveToLocal('tm_users', updatedUsers); playSound('success'); if (window.navigator && window.navigator.vibrate) window.navigator.vibrate(100); showNotification("¡Sección Completada!"); } };
            const toggleFullscreen = () => { if (!document.fullscreenElement) { document.documentElement.requestFullscreen().catch(e => console.log(e)); } else { if (document.exitFullscreen) { document.exitFullscreen(); } } };

            return (
                <>
                    {!currentUser ? (
                        <div className="font-sans text-slate-900 dark:text-slate-100 transition-colors duration-300"><UserLogin onLogin={setCurrentUser} users={users} setUsers={setUsers} /><button onClick={()=>setDark(!dark)} className="fixed top-4 right-4 p-2 bg-white/10 rounded-full hover:bg-white/20 transition text-slate-500 dark:text-slate-400 z-50">{dark ? <Icons.Sun /> : <Icons.Moon />}</button></div>
                    ) : (
                        <div className="min-h-screen flex flex-col font-sans pb-12 bg-slate-100 dark:bg-slate-950 relative">
                            {notif && (<div className="fixed top-20 left-1/2 transform -translate-x-1/2 bg-emerald-600 text-white px-6 py-2 rounded-full shadow-xl z-[100] animate-pop-up font-bold text-sm flex items-center gap-2"><Icons.Check /> {notif}</div>)}
                            <header className="sticky top-0 z-40 bg-emerald-950 text-white px-4 py-3 shadow-lg flex justify-between items-center border-b border-emerald-800"><div className="flex items-center gap-3"><div className="bg-emerald-800 p-2 rounded-full text-emerald-300 shadow-inner ring-1 ring-emerald-700"><Icons.Table /></div><div><h1 className="text-lg font-bold leading-none tracking-tight">Tiro Maestro</h1><span className="text-[10px] text-emerald-400 font-medium">Por Juan Miguel Rios Redondo</span></div></div><div className="flex items-center gap-2"><div className="hidden sm:flex flex-col items-end mr-2"><span className="text-[10px] uppercase text-emerald-400 font-bold">Jugador</span><span className="text-xs font-bold">{currentUser.name}</span></div><button onClick={toggleFullscreen} className="p-2 bg-white/5 rounded-full hover:bg-white/20 text-slate-200 transition" title="Pantalla Completa"><Icons.Expand /></button><button onClick={handleLogout} className="p-2 bg-white/5 rounded-full hover:bg-red-500/20 text-slate-200 hover:text-red-300 transition" title="Cambiar Usuario"><Icons.LogOut /></button><button onClick={()=>setDark(!dark)} className="p-2 bg-white/5 rounded-full hover:bg-white/10 transition">{dark ? <Icons.Sun /> : <Icons.Moon />}</button></div></header>
                            <main className="flex-1 p-4 w-full max-w-2xl mx-auto flex flex-col gap-4">
                                <div className="flex w-full gap-1 px-1 justify-between bg-slate-900/50 p-1 rounded-xl">{getCourseData(currentUser.progress).map(c => (<button key={c.id} onClick={()=>setTab(c.id)} className={`flex-1 flex flex-col items-center justify-center py-2 rounded-lg transition text-center ${tab===c.id ? 'bg-emerald-600 text-white shadow-lg' : 'hover:bg-white/10 text-slate-400'}`}><span className="mb-1">{c.icon}</span><span className="text-[9px] font-bold uppercase leading-none">{c.title.split('. ')[1] || c.title}</span>{c.isComplete && <div className="mt-1 w-1.5 h-1.5 rounded-full bg-emerald-400 shadow-[0_0_5px_#34d399]"></div>}</button>))}</div>
                                <div className="animate-fade-in flex flex-col gap-4">
                                    {activeData?.isQuiz ? (<QuizMode data={activeData.content} onComplete={handleProgress} />) : activeData?.isTrainer ? (<TrainerV7 />) : activeData ? (
                                        <>
                                            <div className="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-5 rounded-2xl shadow-sm"><h2 className="text-xl font-bold mb-3 flex items-center gap-2 text-slate-800 dark:text-white">{activeData.title}</h2><p className="text-slate-600 dark:text-slate-400 text-sm leading-relaxed border-l-4 border-emerald-500 pl-4 mb-5">{activeData.content.summary}</p>{activeData.content.checklist && <RoutineChecklist data={activeData.content} onComplete={handleProgress} />}{activeData.content.details && <div className="grid gap-3 mb-4">{activeData.content.details.map((d,i) => <div key={i} className="bg-slate-50 dark:bg-slate-800/50 p-3 rounded-lg"><h4 className="text-xs font-bold text-indigo-500 uppercase mb-1">{d.title}</h4><p className="text-sm text-slate-700 dark:text-slate-300">{d.text}</p></div>)}</div>}{activeData.content.drills && <div className="grid gap-3"><div className="text-xs font-bold text-slate-400 uppercase mt-2">Ejercicios Prácticos</div>{activeData.content.drills.map((drill, idx) => <div key={idx} className="bg-indigo-50 dark:bg-indigo-900/10 border border-indigo-100 dark:border-indigo-800/30 p-4 rounded-xl"><div className="flex justify-between items-start mb-2"><div className="flex items-center gap-2"><span className={`text-[10px] font-bold px-2 py-0.5 rounded uppercase ${drill.type === 'off' ? 'bg-amber-100 text-amber-700' : 'bg-emerald-100 text-emerald-700'}`}>{drill.type === 'off' ? <span className="flex items-center gap-1"><Icons.Home /> Casa</span> : <span className="flex items-center gap-1"><Icons.Table /> Mesa</span>}</span><h4 className="font-bold text-indigo-900 dark:text-indigo-200 text-sm">{drill.title}</h4></div>{drill.setup && <button onClick={()=>loadDrill(drill.setup)} className="text-[10px] font-bold bg-indigo-600 text-white px-2 py-1 rounded flex items-center gap-1 hover:bg-indigo-700 transition"><Icons.Play /> Cargar</button>}</div><p className="text-sm text-slate-600 dark:text-slate-400">{drill.desc}</p>{drill.tool && <div className="mt-2 pt-2 border-t border-indigo-200 dark:border-indigo-800">{drill.tool}</div>}</div>)}</div>}{activeData.content.evaluation && <EvaluationCard data={activeData.content.evaluation} onComplete={handleProgress} />}</div>
                                            {activeData.isSimulator && <SmartSimulator onLoadDrill={drillLoader} />}
                                        </>
                                    ) : null}
                                </div>
                            </main>
                        </div>
                    )}
                </>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
